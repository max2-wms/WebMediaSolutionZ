version: '3.3'

services:

  wordpress:
    container_name: web
    depends_on:
      - db
    image: max2wms/wms
    build: .
    volumes:
      - ./web:/var/www/html
      - ./php.ini:/var/www/html/php.ini
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_PASSWORD: password01
    ports:
      - 80:80
    networks:
      - wms

  db:
    container_name: mysql
    image: mysql:5.7
    volumes:
      - wms_data:/var/lib/mysql
      - ./data/bootup:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: password01
    networks:
      - wms

  phpmyadmin:
    container_name: phpmyadmin
    depends_on:
      - db
    image: phpmyadmin
    ports:
      - 8080:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: Password_01
      PMA_ARBITRARY: 1
    networks:
      - wms

networks:
  wms:

volumes:
  wms_data: